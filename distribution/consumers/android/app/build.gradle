apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def sdkVersion = providers.gradleProperty("crumbVersion").orNull
if (sdkVersion == null || sdkVersion.trim().isEmpty()) {
    throw new GradleException("Pass -PcrumbVersion with the staged SDK version")
}

android {
    namespace "dev.crumb.distributionconsumer"
    compileSdk 36

    defaultConfig {
        applicationId "dev.crumb.distributionconsumer"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

layout.buildDirectory = providers.gradleProperty("crumbConsumerBuildDir").map { file(it) }

dependencies {
    // Core must arrive transitively through the published UI POM.
    implementation "com.crumbsdk:crumb-ui:${sdkVersion}"
    // React Native support is published separately; resolving it here keeps its
    // Kotlin metadata and stdlib floor under the same rehearsal.
    implementation "com.crumbsdk:crumb-react-native:${sdkVersion}"
}

tasks.register("writeCrumbResolutionEvidence") {
    doLast {
        def evidencePath = providers.gradleProperty("crumbConsumerEvidence").orNull
        if (!evidencePath) {
            throw new GradleException("Pass -PcrumbConsumerEvidence with the evidence output path")
        }
        def describe = { artifact ->
            [
                group: artifact.moduleVersion.id.group,
                name: artifact.moduleVersion.id.name,
                version: artifact.moduleVersion.id.version,
                moduleComponent: artifact.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier,
                file: artifact.file.absolutePath,
                sha256: java.security.MessageDigest.getInstance("SHA-256").digest(artifact.file.bytes).encodeHex().toString(),
            ]
        }
        def evidence = [
            compile: configurations.debugCompileClasspath.resolvedConfiguration.resolvedArtifacts.collect(describe),
            runtime: configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect(describe),
            compiler: configurations.kotlinCompilerClasspath.resolvedConfiguration.resolvedArtifacts.collect(describe),
        ]
        def destination = file(evidencePath)
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + "\n"
    }
}
