name: React Native SDK checks

on:
  pull_request:
    paths:
      - "packages/react-native/**"
      - ".github/workflows/react-native-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/react-native/**"
      - ".github/workflows/react-native-ci.yml"

permissions:
  contents: read

concurrency:
  group: react-native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn quality
      - run: yarn pack:check

  android-example:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn nitrogen
      - run: yarn example expo prebuild --platform android --clean
      - run: yarn example build:android

  ios-example:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn nitrogen
      - run: yarn example expo prebuild --platform ios --clean
      - run: yarn example build:ios
