name: Native SDK checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Check release inputs and native distribution
        run: npm run release:check
      - name: Build and verify release artifacts
        run: npm run release:prepare && npm run release:verify
      - uses: actions/upload-artifact@v6
        with:
          name: crumb-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
