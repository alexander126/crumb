name: Source-map CLI checks

on:
  pull_request:
    paths:
      - packages/source-maps/**
      - schemas/source-map-upload.schema.json
      - schemas/examples/source-map-upload.*.json
      - scripts/validate-contracts.mjs
      - docs/source-maps.md
      - docs/contracts/source-map-upload.md
      - VERSION
      - .github/workflows/source-maps-*.yml
  push:
    branches: [main]
    paths:
      - packages/source-maps/**
      - schemas/source-map-upload.schema.json
      - schemas/examples/source-map-upload.*.json
      - scripts/validate-contracts.mjs
      - docs/source-maps.md
      - docs/contracts/source-map-upload.md
      - VERSION
      - .github/workflows/source-maps-*.yml

permissions:
  contents: read

concurrency:
  group: source-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/source-maps/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm ci
        working-directory: packages/source-maps
      - run: npm run typecheck
        working-directory: packages/source-maps
      - run: npm test
        working-directory: packages/source-maps
      - run: npm run pack:check
        working-directory: packages/source-maps
