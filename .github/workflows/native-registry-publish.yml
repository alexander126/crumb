name: Publish native registries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable release tag to publish
        required: true
        type: string
      registry:
        description: Registry target
        required: true
        default: both
        type: choice
        options:
          - both
          - cocoapods
          - maven
      confirmation:
        description: Type "publish <tag>" to confirm the immutable publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-registry-${{ inputs.tag }}-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate explicit publication confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${CONFIRMATION}" != "publish ${RELEASE_TAG}" ]]; then
            echo "Confirmation must exactly match: publish ${RELEASE_TAG}" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify immutable tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npm run release:tag-check -- "${RELEASE_TAG}"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  cocoapods:
    if: inputs.registry == 'both' || inputs.registry == 'cocoapods'
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `pod trunk push` validates each pod against trunk's PLCrashReporter, which
      # declares iOS 12.0 and cannot be replaced by Crumb's wrapper here. Xcode 27
      # rejects that minimum; Xcode 26.6 accepts it. Select it explicitly instead of
      # the image default. See docs/distribution/registries.md.
      - name: Select an Xcode that accepts PLCrashReporter's declared minimum
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Publish CocoaPods in dependency order
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: npm run registry:publish:cocoapods
      - name: Verify public CocoaPods metadata
        run: npm run registry:verify -- --cocoapods

  maven:
    if: inputs.registry == 'both' || inputs.registry == 'maven'
    needs: validate
    # The Android unit tests run on macOS everywhere else. On a Linux JVM,
    # /proc/self/cmdline names the java executable, so the report queue's
    # main-process boundary refuses it; Android devices report the app process.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run test:android
      - name: Build signed Maven Central bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: npm run registry:bundle:maven
      - uses: actions/upload-artifact@v6
        with:
          name: crumb-maven-central-${{ needs.validate.outputs.tag }}
          path: dist/registry/maven/${{ needs.validate.outputs.tag }}/crumb-maven-central-${{ needs.validate.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish through the Maven Central Publisher API
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: npm run registry:publish:maven -- --automatic
      - name: Verify clean Maven Central consumer
        run: npm run registry:verify -- --maven
